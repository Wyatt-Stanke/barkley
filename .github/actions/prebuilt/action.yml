# Finds a build of exactly these sources made by an earlier run, so a job need not build it again. A build is kept as an
# artifact named after a hash of everything that goes into it (src/, virt/, the recovered scripts, the setup action),
# holding build/pipeline/site and build/pipeline/playtest: the PR check uploads one, and the deploy after the merge
# downloads it instead of building (and play-testing) the same sources again, so what is deployed is the build the PR
# check fuzzed. Docs, the fuzzer and its corpus (fuzz/; a build is src/build.mjs) and the workflows are left out of the
# hash.
#
# Only runs from this repository count, never one from a fork: a fork's pull_request run can upload any artifact under
# any name. Needs `actions: read`.
name: Find a prebuilt site
description: Downloads build/pipeline/{site,playtest} from an earlier run that built these same sources
outputs:
  key:
    description: The artifact name for these sources (upload under it after a build)
    value: ${{ steps.key.outputs.key }}
  found:
    description: "'true' when build/pipeline/site was downloaded"
    value: ${{ steps.find.outputs.run != '' }}
runs:
  using: composite
  steps:
    # Before anything writes into src/ (src/web/node_modules) or build/.
    - id: key
      shell: bash
      run: echo "key=site-${{ hashFiles('src/**', '!src/**/*.md', '!src/web/node_modules/**', 'virt/**', '!virt/**/*.md', 'game/recovered-scripts/**', '.github/actions/**') }}" >> "$GITHUB_OUTPUT"

    - id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ steps.key.outputs.key }}
      run: |
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$KEY&per_page=100" --jq \
          '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty' \
          || true)
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [ -n "$run" ]; then echo "reusing $KEY from run $run"; else echo "no build of $KEY yet"; fi

    - if: steps.find.outputs.run != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.key.outputs.key }}
        path: build/pipeline
        run-id: ${{ steps.find.outputs.run }}
        github-token: ${{ github.token }}
